---
# Part B: a base for every server
- name: Base for every server
  hosts: all
  become: true
  tasks:
    - name: Install the base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

# Part C: the database
- name: Database
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: secret
  tasks:
    - name: Install PostgreSQL and the library Ansible uses to talk to it
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Listen on all addresses
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow password logins from the network
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 scram-sha-256"
      notify: Restart PostgreSQL

    # After the install the database is not running yet on these servers,
    # so start it before creating the user and the database.
    - name: Make sure PostgreSQL is running
      ansible.builtin.service:
        name: postgresql@17-main
        state: started

    - name: Create the database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become_user: postgres

    - name: Create the database
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

# Part D: the web servers
- name: Web servers
  hosts: web
  become: true
  vars:
    repo_url: https://github.com/Polyma-29/devops-labs-fn373223046.git
    database_url: "postgresql://notes:secret@db:5432/notes"
  tasks:
    - name: Install Python tools and git
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Get the code from the repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Install the Python dependencies into a virtual environment
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Install the systemd service
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
        mode: "0644"
      notify: Restart notes

    - name: Start the service and enable it at boot
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true
