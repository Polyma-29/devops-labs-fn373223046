name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://notes:ci-only@localhost:5432/notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t notes-api:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 notes-api:${{ github.sha }}
          for _ in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag notes-api:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag notes-api:${{ github.sha }} "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag notes-api:${{ github.sha }} "$IMAGE:${{ github.ref_name }}"
            docker push "$IMAGE:${{ github.ref_name }}"
          fi

          echo "***" | docker login ghcr.io -u "Polyma-29" --password-stdin
          docker push "$IMAGE:020064ba997327c8b7b1048cfc56ea04b98df8b2"
          if [ "refs/heads/main" = "refs/heads/main" ]; then
           docker tag "$IMAGE:020064ba997327c8b7b1048cfc56ea04b98df8b2" "$IMAGE:latest"
           docker push "$IMAGE:latest"
          fi

          if [ "branch" = "tag" ]; then
           docker tag "$IMAGE:020064ba997327c8b7b1048cfc56ea04b98df8b2" "$IMAGE:main"
           docker push "$IMAGE:main"
          fi

          shell: /usr/bin/bash -e {0}
        env: 
          IMAGE: ghcr.io/polyma-29/devops-labs-fn373223046